name: Smart House Scale CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -r smart_house_scale/backend/requirements.txt pytest httpx
      - name: Run tests
        run: pytest -q smart_house_scale/tests
      - name: Compile Python sources
        run: python -m compileall -q smart_house_scale/backend smart_house_scale/custom_components smart_house_scale/addon_app smart_house_scale/tests
