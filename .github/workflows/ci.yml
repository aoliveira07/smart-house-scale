name: Smart House Scale CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q backend custom_components tests
