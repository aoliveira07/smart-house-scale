[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-house-scale"
version = "0.7.0"
description = "Smart House Scale App bridge and central API module"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "aiomqtt>=2.3,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "websockets>=12,<16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
