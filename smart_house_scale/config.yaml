name: "Smart House Scale"
slug: "smart-house-scale"
description: "Aplicativo Smart House para administrar a balança Xiaomi, usuários, histórico e pendências."
version: "0.4.3"
stage: experimental
startup: application
boot: auto

arch:
  - amd64
  - aarch64

# The central Smart House API is intentionally LAN-only.  Use the official
# Home Assistant App host network mode so the proxy can reach 192.168.0.201.
host_network: true

image: ghcr.io/aoliveira07/home-assistant-smart-house-scale
init: false

# The App bundles the reviewed custom integration and bootstraps it into the
# Home Assistant config on first start.  This removes the manual HACS step for
# new installations while preserving the normal HA custom_components layout.
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant

# Used only to request a one-time Home Assistant Core restart after the
# integration is copied.  The App never receives PostgreSQL access.
homeassistant_api: true

ingress: true
ingress_port: 18099
panel_icon: mdi:scale-bathroom
panel_title: Smart House Scale
watchdog: "http://[HOST]:18099/health"

options:
  api_url: "http://192.168.0.201"
  api_token: ""

schema:
  api_url: url
  api_token: password
