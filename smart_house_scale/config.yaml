name: "Tecnohead Scale"
slug: "smart-house-scale"
description: "Aplicativo Tecnohead para administrar a balança, usuários, histórico e pendências."
version: "0.7.3"
stage: experimental
startup: application
boot: auto

arch:
  - amd64
  - aarch64

# The central Smart House API is intentionally LAN-only.  Use the official
# Home Assistant App host network mode so the proxy can reach 192.168.0.201.
host_network: true

image: ghcr.io/aoliveira07/home-assistant-smart-house-scale
init: false

# The App uses the official Supervisor REST/WebSocket proxy. It does not mount
# or modify the Home Assistant configuration directory.
homeassistant_api: true

# MQTT Discovery is the supported Home Assistant entity surface for Alexa,
# HomeKit and dashboards. The App continues to run without a broker, but user
# entities remain unavailable until the MQTT service is available.
services:
  - mqtt:want

ingress: true
ingress_port: 18099
panel_icon: mdi:heart-plus
panel_title: Tecnohead Scale
watchdog: "http://[HOST]:18099/health"

options:
  api_url: "http://192.168.0.201"
  api_token: ""
  weight_entity_id: "sensor.casal_balanca_peso"
  mqtt_discovery_prefix: "homeassistant"

schema:
  api_url: url
  api_token: password
  weight_entity_id: str
  mqtt_discovery_prefix: str
